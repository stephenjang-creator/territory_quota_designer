[project]
name = "territory-quota-designer"
version = "0.1.0"
description = "RevOps territory balancing, quota derivation, reverse-waterfall coverage, and comp modeling — deterministic core, human-in-the-loop LLM."
requires-python = ">=3.11"

[tool.black]
line-length = 100
target-version = ["py311"]
# generate_territory_data.py ships as-is (SPEC: "EXISTS — do not rewrite").
extend-exclude = "generate_territory_data.py"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["generate_territory_data.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
